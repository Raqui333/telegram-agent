readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "langchain>=1.3.4",
    "langchain-core>=1.4.1",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.4",
    "langgraph-api>=0.9.0",
    "langgraph-checkpoint-postgres>=3.1.0",
    "langgraph-cli>=0.4.27",
    "psycopg2>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-telegram-bot>=22.7",
    "rich-logger>=0.3.2",
    "sqlalchemy>=2.0.50",
    "tavily-python>=0.7.25",
    "telegramify-markdown[mermaid]>=1.1.5",
]
